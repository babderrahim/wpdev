x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: ${DB_NAME}
  WORDPRESS_DB_USER: ${DB_USER}
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
  WORDPRESS_DEBUG: "1"
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_HOME', 'http://localhost:${WP_PORT}');
    define('WP_SITEURL', 'http://localhost:${WP_PORT}');
    define('WP_ENVIRONMENT_TYPE', 'local');
    define('WP_DEBUG_LOG', true);
    define('WP_DEBUG_DISPLAY', false);
    define('SCRIPT_DEBUG', true);

x-wp-volumes: &wp-volumes
  - wp_core:/var/www/html
  - ./wp-content/themes:/var/www/html/wp-content/themes
  - ./wp-content/plugins:/var/www/html/wp-content/plugins
  - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 30

  wordpress:
    build:
      context: ./docker/php
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      <<: *wp-env
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    volumes: *wp-volumes
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # WP-CLI. Not started by `up`; used via ./bin/wp (docker compose run).
  cli:
    image: wordpress:cli-php8.3
    profiles: [tools]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      <<: *wp-env
      HOME: /tmp
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      WP_URL: http://localhost:${WP_PORT:-8080}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_LOCALE: ${WP_LOCALE:-en_US}
    volumes:
      - wp_core:/var/www/html
      - ./wp-content/themes:/var/www/html/wp-content/themes
      - ./wp-content/plugins:/var/www/html/wp-content/plugins
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./backups:/backups
      - ./docker/wp-setup.sh:/usr/local/bin/wp-setup.sh:ro
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAIL_PORT:-8025}:8025"

volumes:
  wp_core:
  db_data:
